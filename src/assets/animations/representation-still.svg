<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 640 380" width="1280" height="760">
  <title>Representação Técnica Especializada</title>
  <style>
    svg { background: #ffffff; }
    .p:not([fill]), .t:not([fill]) { fill: none; }
    .p  { stroke: #012D48; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .t  { stroke: #012D48; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
    .c  { fill: none; stroke: #012D48; stroke-width: 1; stroke-dasharray: 14 4 2 4; }
    .d  { fill: none; stroke: #012D48; stroke-width: 1; }
    .acc { stroke: #F07D00; }
    text { font-family: "Consolas", "Courier New", monospace; fill: #012D48; letter-spacing: 2px; }
    .lbl { font-size: 15px; }
    .sm  { font-size: 12px; letter-spacing: 1px; }
    .or  { fill: #F07D00; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#012D48" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>

  <!-- ===== Origem: fabricante ===== -->
  <g transform="translate(110 100)">
    <path d="M0,0 C-15,-15 -15,-36 0,-36 C15,-36 15,-15 0,0 Z" class="p" fill="#fff"/>
    <circle cx="0" cy="-23" r="5" class="p"/>
    <text x="0" y="24" class="lbl" text-anchor="middle">ADAMUS S.A.</text>
    <text x="0" y="40" class="sm" text-anchor="middle">fabricante · Polônia</text>
  </g>

  <!-- ===== Destino: representante exclusivo ===== -->
  <g transform="translate(530 100)">
    <circle cx="0" cy="-23" r="22" class="d acc" stroke-dasharray="4 3">
      
    </circle>
    <path d="M0,0 C-15,-15 -15,-36 0,-36 C15,-36 15,-15 0,0 Z" class="p acc" fill="#fff"/>
    <circle cx="0" cy="-23" r="5" class="p acc"/>
    <text x="0" y="24" class="lbl" text-anchor="middle">PUNCH CARE</text>
    <text x="0" y="40" class="sm" text-anchor="middle">representante</text>
    <text x="0" y="54" class="sm or" text-anchor="middle">exclusivo · Brasil</text>
  </g>

  <!-- ===== Rota ===== -->
  <path id="rota" d="M128,70 Q320,-4 512,70" class="c">
    
  </path>
  <g>
    
    <g transform="translate(-8 -7)">
      <rect x="0" y="0" width="16" height="12" fill="#fff" class="p acc"/>
      <line x1="0" y1="4" x2="16" y2="4" class="t acc"/>
      <line x1="8" y1="0" x2="8" y2="4" class="t acc"/>
    </g>
  </g>
  <text x="320" y="92" class="lbl" text-anchor="middle">REPRESENTAÇÃO</text>
  <text x="320" y="110" class="lbl" text-anchor="middle">TÉCNICA <tspan class="or">EXCLUSIVA</tspan></text>

  <line x1="46" y1="190" x2="594" y2="190" class="c"/>

