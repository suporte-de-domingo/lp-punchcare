<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <title>Punção, desenho técnico animado</title>
  <style>
    svg { background: #ffffff; }
    .p  { fill: none; stroke: #012D48; stroke-width: 2; stroke-linejoin: round; }
    .t  { fill: none; stroke: #012D48; stroke-width: 1.2; }
    .c  { fill: none; stroke: #012D48; stroke-width: 1; stroke-dasharray: 14 4 2 4; }
    .d  { fill: none; stroke: #012D48; stroke-width: 1; }
    .a  { fill: #012D48; }
    text { font-family: "Consolas", "Courier New", monospace; font-size: 17px; letter-spacing: 3px; fill: #012D48; }

    /* curso horizontal da punção (vai e volta, como na compressora) */
    #peca {  }
    @keyframes curso { from { transform: translateX(0); } to { transform: translateX(-70px); } }

    /* linha de centro "correndo" para reforçar o movimento */
    .flow {  }
    @keyframes fluxo { to { stroke-dashoffset: -24; } }

    @media (prefers-reduced-motion: reduce) { #peca, .flow {  } }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 Z" class="a"/>
    </marker>
  </defs>

  <!-- ===== Vista frontal (fixa) ===== -->
  <g id="vista-frontal">
    <circle cx="90" cy="176" r="60" class="p"/>
    <circle cx="90" cy="176" r="19" class="p"/>
    <line x1="90" y1="70"  x2="90"  y2="250" class="c"/>
    <line x1="15" y1="176" x2="170" y2="176" class="c"/>
    <!-- Ø8,0 -->
    <line x1="71"  y1="176" x2="71"  y2="80" class="d"/>
    <line x1="109" y1="176" x2="109" y2="80" class="d"/>
    <line x1="71" y1="88" x2="109" y2="88" class="d" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="109" y1="88" x2="185" y2="88" class="d"/>
    <text x="122" y="83">Ø8,0</text>
  </g>

  <!-- linha de centro da vista lateral (fixa, com fluxo) -->
  <line x1="190" y1="176" x2="940" y2="176" class="c flow"/>

  <!-- ===== Vista lateral (em movimento) ===== -->
  <g id="peca">
    <g>
      <!-- contorno -->
      <path class="p" d="
        M265,161 L268,157 L284,157 L287,160 L299,160 Q305,160 305,152 L305,134 L308,131
        L797,131 L808,139 L862,139 L872,117 L888,117 Q906,124 906,176
        Q906,228 888,235 L872,235 L862,213 L808,213 L797,221 L308,221 L305,218
        L305,200 Q305,192 299,192 L287,192 L284,195 L268,195 L265,191 Z"/>

      <!-- arestas internas -->
      <line x1="268" y1="157" x2="268" y2="195" class="t"/>
      <line x1="284" y1="157" x2="284" y2="195" class="t"/>
      <path d="M268,168 L276,176 L268,184" class="t"/>
      <line x1="305" y1="134" x2="305" y2="218" class="t"/>
      <line x1="311" y1="131" x2="311" y2="221" class="t"/>
      <line x1="315" y1="131" x2="315" y2="221" class="t"/>
      <line x1="341" y1="131" x2="341" y2="221" class="t"/>
      <line x1="346" y1="131" x2="346" y2="221" class="t"/>
      <line x1="797" y1="131" x2="797" y2="221" class="t"/>
      <line x1="808" y1="139" x2="808" y2="213" class="t"/>
      <line x1="862" y1="139" x2="862" y2="213" class="t"/>
      <line x1="872" y1="117" x2="872" y2="235" class="t"/>
      <line x1="877" y1="117" x2="877" y2="235" class="t"/>

      <!-- Ø19 -->
      <line x1="555" y1="131" x2="555" y2="221" class="d" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <text transform="translate(549 198) rotate(-90)">Ø19</text>

      <!-- Ø25,27 -->
      <line x1="880" y1="117" x2="975" y2="117" class="d"/>
      <line x1="880" y1="235" x2="975" y2="235" class="d"/>
      <line x1="968" y1="117" x2="968" y2="235" class="d" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <text transform="translate(962 222) rotate(-90)">Ø25,27</text>

      <!-- linhas de chamada inferiores -->
      <line x1="265" y1="195" x2="265" y2="372" class="d"/>
      <line x1="285" y1="198" x2="285" y2="295" class="d"/>
      <line x1="305" y1="221" x2="305" y2="334" class="d"/>
      <line x1="862" y1="215" x2="862" y2="315" class="d"/>
      <line x1="906" y1="236" x2="906" y2="372" class="d"/>

      <!-- 4 -->
      <line x1="248" y1="287" x2="265" y2="287" class="d" marker-end="url(#ar)"/>
      <line x1="302" y1="287" x2="285" y2="287" class="d" marker-end="url(#ar)"/>
      <line x1="265" y1="287" x2="285" y2="287" class="d"/>
      <text x="270" y="282">4</text>

      <!-- 8,5 -->
      <line x1="248" y1="326" x2="265" y2="326" class="d" marker-end="url(#ar)"/>
      <line x1="322" y1="326" x2="305" y2="326" class="d" marker-end="url(#ar)"/>
      <line x1="265" y1="326" x2="362" y2="326" class="d"/>
      <text x="320" y="320">8,5</text>

      <!-- 9,1 -->
      <line x1="808" y1="308" x2="862" y2="308" class="d"/>
      <line x1="862" y1="308" x2="906" y2="308" class="d" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <text x="810" y="302">9,1</text>

      <!-- 133,6 -->
      <line x1="265" y1="365" x2="906" y2="365" class="d" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <text x="553" y="358">133,6</text>
    </g>
  </g>
</svg>
